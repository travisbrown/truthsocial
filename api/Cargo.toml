[package]
name = "truthsocial-api"
description = "Async client for the Truth Social (Mastodon-compatible) HTTP API"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
readme.workspace = true
# Fixtures under `tests/` bundle real captured API responses; they are not needed to build or use the
# crate, so keep them out of the published tarball.
exclude = ["tests/"]

[dependencies]
truthsocial = { path = "../core", version = "0.1.0" }
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
# A browser-impersonating HTTP client (TLS/HTTP2 fingerprint + headers) so Cloudflare does not block
# requests as it does a stock client. The decompression features are required because the emulated
# Chrome advertises `Accept-Encoding: gzip, deflate, br, zstd` and Cloudflare replies compressed.
wreq = { version = "5.3.0", features = ["gzip", "brotli", "zstd", "deflate"] }
wreq-util = "2.2.6"
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

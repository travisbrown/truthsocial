[package]
name = "truthsocial-wbm"
description = "Wayback Machine (WTJ) archive snapshot integration for Truth Social types"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
readme.workspace = true
# Fixtures under `tests/` bundle real captured API responses; they are not needed to build or use the
# crate, so keep them out of the published tarball.
exclude = ["tests/"]

[dependencies]
archivindex-wbm.workspace = true
archivindex-wbm-json.workspace = true
archivindex-wbm-json-gzip.workspace = true
bounded-static.workspace = true
either.workspace = true
log.workspace = true
truthsocial = { path = "../core", version = "0.1.0" }
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
toml.workspace = true
zstd.workspace = true

[dev-dependencies]
flate2.workspace = true
tempfile.workspace = true

[package]
name = "truthsocial-api"
description = "Async client for the Truth Social HTTP API"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
readme.workspace = true
# Fixtures under `tests/` bundle real captured API responses; they are not needed to build or use
# the crate, so keep them out of the published tarball.
exclude = ["tests/"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
archivindex-publication.workspace = true
truthsocial.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
toml.workspace = true
wreq.workspace = true
wreq-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

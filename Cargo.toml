[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# `tools/api-cli` pulls in `chromiumoxide` (a heavy, browser-driving dependency), so it is excluded
# from the default set. Build it explicitly with `-p truthsocial-api-cli`.
default-members = ["crates/api", "crates/core", "crates/wbm", "tools/wbm-cli"]

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
homepage = "https://github.com/travisbrown/truthsocial"
repository = "https://github.com/travisbrown/truthsocial"
keywords = ["truthsocial", "mastodon"]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
version = "0.1.0"
readme = "README.md"

[workspace.dependencies]
archivindex-cli-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-publication = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-wbm = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-wbm" }
archivindex-wbm-cdx-index = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-wbm" }
archivindex-wbm-json = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-wbm" }
archivindex-wbm-json-gzip = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-wbm" }
archivindex-wbm-json-processing = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-wbm" }
archivindex-wbm-test-data = { git = "https://github.com/travisbrown/archivindex-wbm" }
bounded-static = "0.8"
# Drives a headed Chromium so the user can log in / clear Cloudflare (`truthsocial-api setup`).
chromiumoxide = "0.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
either = { version = "1", features = ["serde"] }
flate2 = "1"
futures = "0.3"
log = "0.4"
rand = "0.10"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde-field-attributes = "0.7"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "1"
truthsocial = { version = "0.1.0", path = "crates/core" }
truthsocial-api = { version = "0.1.0", path = "crates/api" }
truthsocial-wbm = { version = "0.1.0", path = "crates/wbm" }
url = { version = "2", features = ["serde"] }
wiremock = "0.6"
# Emulates a browser's TLS/HTTP2 fingerprint and headers, without which Cloudflare rejects requests
# as it does from a stock client. The decompression features are required because the emulated
# browser advertises `Accept-Encoding: gzip, deflate, br, zstd` and Cloudflare replies compressed.
wreq = { version = "0.16", features = ["gzip", "brotli", "zstd", "deflate", "form", "query"] }
wreq-util = "0.2"
zstd = "0.14"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
